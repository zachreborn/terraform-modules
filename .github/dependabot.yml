version: 2
updates:
  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "zachreborn"
      - "Jakeasaurus"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-monthly-batch:
        applies-to: version-updates
        patterns:
          - "*"

  # ─── Terraform / OpenTofu providers and registry modules ─────────────────────
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "zachreborn"
      - "Jakeasaurus"
    labels:
      - "dependencies"
      - "opentofu-terraform"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      terraform-monthly-batch:
        applies-to: version-updates
        patterns:
          - "*"
